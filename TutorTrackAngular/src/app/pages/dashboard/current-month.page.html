@if (isLoading()) {
  <state-handler-component type="loading" message="HomePage.Loading.Message"></state-handler-component>
}
@else {
  @if(isError()) {
    <state-handler-component 
      type="error" 
      title="HomePage.Error.Title" 
      message="HomePage.Error.Message"
      buttonLabel="HomePage.Error.Retry"
      (action)="loadData()">
    </state-handler-component>
  } 
  @else {
    <div class="dashboard-wrapper back p-4">
      <section class="dashboard-section mb-5">
        <div class="section-title-row">
          <h3 class="text-color section-title">
            {{ "HomePage.Sections.ThisMonth" | translate }} - {{ currentMonthName() }}
          </h3>

          <div class="month-nav">
            <button mat-icon-button (click)="goToPreviousMonth()" [attr.aria-label]="'HomePage.Sections.PreviousMonth' | translate">
              <mat-icon>chevron_left</mat-icon>
            </button>
            <button mat-icon-button (click)="goToNextMonth()" [disabled]="isCurrentMonth()" [attr.aria-label]="'HomePage.Sections.NextMonth' | translate">
              <mat-icon>chevron_right</mat-icon>
            </button>
          </div>
        </div>

        <div class="cards-row mb-4">
          <stat-card-component 
            [label]="'HomePage.Stats.TotalCurrentMonth' | translate" 
            [value]="totalIncome() ?? -1"
            [isLabelCurrency]="true"
            icon="payments" 
            colorClass="blue">
          </stat-card-component>

          <stat-card-component 
            [label]="'HomePage.Stats.WorkedHours' | translate" 
            [value]="totalHoursWorked() ?? -1"
            icon="schedule" 
            colorClass="orange">
          </stat-card-component>
        </div>

        <div class="charts-row mt-4">
          <mat-card class="chart-container full-width card-border-theme background-color-custom-ligher">
            <mat-card-content>
              <canvas baseChart
                [data]="pieChartData"
                [options]="pieChartOptions"
                [type]="'pie'">
              </canvas>
            </mat-card-content>
          </mat-card>
        </div>

        <div class="charts-row mt-4">
          <mat-card class="chart-container full-width card-border-theme background-color-custom-ligher">
            <mat-card-content class="chart-content-with-title">
              <h4 class="text-color chart-title">{{ "HomePage.Labels.MonthEntries" | translate }}</h4>
              <div class="chart-canvas-wrapper">
                <canvas baseChart
                  [data]="entriesChartData"
                  [options]="barChartOptions"
                  [type]="'bar'">
                </canvas>
              </div>
            </mat-card-content>
          </mat-card>
        </div>
      </section>
    </div>
  }
}
