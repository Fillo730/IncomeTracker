<div class="admin-container">
  <div class="header-actions">
    @if (!isError() && !isLoading()) {
      <incomes-filter-component 
          [filters]="currentFilters()" 
          [categories]="incomeTypes() ?? []" 
          (filterChanged)="onFilterChanged($event)"
          (filterReset)="resetFilters()">
      </incomes-filter-component>

      <button mat-fab color="primary" class="fab-add" (click)="openAddDialog()">
        <mat-icon>add</mat-icon>
      </button>
    }
  </div>

  @if (isLoading()) {
    <state-handler-component type="loading" message="Incomes.Loading"></state-handler-component>
  }
  @else if (isError()) {
    <state-handler-component type="error" (action)="loadData()"></state-handler-component>
  }
  @else {
    <div class="content-area mt-4">
      @if (incomes().length > 0) {
        
        <app-income-card-list 
          [incomes]="incomes()"
          (edit)="onEditIncome($event)"
          (delete)="onDeleteIncome($event)">
        </app-income-card-list>

        <pager-component
          [totalItems]="totalItems()"
          [pageSize]="pageSize()"
          [pageIndex]="pageIndex()"
          (pageChange)="handlePageEvent($event)">
        </pager-component>

      } 
      @else {
        <div class="grow">
          <div class="empty-state-container card-border-theme background-color-custom-ligher p-5 text-center">
            <mat-icon class="big-icon opacity-5">receipt_long</mat-icon>
            <h3 class="text-color mt-3">{{ 'Incomes.Welcome.Title' | translate }}</h3>
            <button mat-raised-button color="primary" (click)="openAddDialog()" class="mt-3">
              {{ 'Incomes.Buttons.FirstEntry' | translate }}
            </button>
          </div>
        </div>
      }
    </div>
  }
</div>
