<div class="admin-container">
  <div class="header-actions">
    @if (!isError() && !isLoading()) {
      <h1 class="page-title text-color">{{ 'Header.Navigation.Students' | translate }}</h1>

      <button mat-fab color="primary" class="fab-add" (click)="openAddDialog()">
        <mat-icon>add</mat-icon>
      </button>
    }
  </div>

  @if (isLoading()) {
    <state-handler-component type="loading" message="Students.Loading"></state-handler-component>
  }
  @else if (isError()) {
    <state-handler-component type="error" (action)="loadData()"></state-handler-component>
  }
  @else {
    <div class="content-area mt-4">
      @if (students().length > 0) {

        <app-student-card-list
          [students]="students()"
          (edit)="onEditStudent($event)"
          (delete)="onDeleteStudent($event)"
          (viewHistory)="onViewHistory($event)">
        </app-student-card-list>

      }
      @else {
        <div class="grow">
          <div class="empty-state-container background-color-custom-ligher p-5 text-center">
            <mat-icon class="big-icon opacity-5">person_outline</mat-icon>
            <h3 class="text-color mt-3">{{ 'Students.Welcome.Title' | translate }}</h3>
            <button mat-raised-button color="primary" (click)="openAddDialog()" class="mt-3">
              {{ 'Students.Buttons.FirstStudent' | translate }}
            </button>
          </div>
        </div>
      }
    </div>
  }
</div>
