<mat-card class="student-card card-border-theme">
  <mat-card-content>
    <div class="card-header">
      <div class="icon-container background-color-custom-ligher">
        <mat-icon color="primary">person</mat-icon>
      </div>
      <div class="title-section">
        <h3 class="description text-color">{{ student.name }}</h3>
      </div>
      <div class="actions">
        <button mat-icon-button (click)="onViewHistory()" [matTooltip]="'Students.Buttons.ViewHistory' | translate">
          <mat-icon>history</mat-icon>
        </button>
        <button mat-icon-button (click)="onEdit()" color="primary">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button (click)="onDelete()" color="warn">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </div>
  </mat-card-content>
</mat-card>
