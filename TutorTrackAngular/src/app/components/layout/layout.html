<mat-sidenav-container class="admin-container background-color-custom-ligher">
  
  <mat-sidenav mode="side" opened class="admin-sidenav background-color-custom d-none d-md-block">
    <mat-nav-list class="admin-nav">
      <a mat-list-item (click)="navigationService.goToDashboard()">
        <span class="text-color">{{ "Header.Navigation.Dashboard" | translate }}</span>
      </a>
      <a mat-list-item (click)="navigationService.goToCurrentYear()">
        <span class="text-color">{{ "Header.Navigation.CurrentYear" | translate }}</span>
      </a>
      <a mat-list-item (click)="navigationService.goToAddEntry()">
        <span class="text-color">{{ "Header.Navigation.AddEntry" | translate }}</span>
      </a>
      <a mat-list-item (click)="navigationService.goToStudents()">
        <span class="text-color">{{ "Header.Navigation.Students" | translate }}</span>
      </a>
    </mat-nav-list>

    <div class="d-flex flex-row align-items-center p-3 gap-3 border-top">
      <language-selector></language-selector>
      <theme-selector-component [isDark]="themeService.isDark()" (toggleTheme)="themeService.toggleTheme()"></theme-selector-component>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="d-md-none background-color-custom text-color shadow-sm">
      <button mat-icon-button [matMenuTriggerFor]="mobileMenu">
        <mat-icon>menu</mat-icon>
      </button>

      <mat-menu #mobileMenu="matMenu">
        <button mat-menu-item (click)="navigationService.goToDashboard()">{{ "Header.Navigation.Dashboard" | translate }}</button>
        <button mat-menu-item (click)="navigationService.goToCurrentYear()">{{ "Header.Navigation.CurrentYear" | translate }}</button>
        <button mat-menu-item (click)="navigationService.goToAddEntry()">{{ "Header.Navigation.AddEntry" | translate }}</button>
        <button mat-menu-item (click)="navigationService.goToStudents()">{{ "Header.Navigation.Students" | translate }}</button>
        <div class="p-2 d-flex flex-row align-items-center gap-2 border-top">
           <language-selector></language-selector>
           <theme-selector-component [isDark]="themeService.isDark()" (toggleTheme)="themeService.toggleTheme()"></theme-selector-component>
        </div>
      </mat-menu>
    </mat-toolbar>

    <div class="admin-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
