services:
  tutortrack:
    build: .
    ports:
      - "8080:8080"
    environment:
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-TutorTrackApi}
      - Jwt__Audience=${JWT_AUDIENCE:-TutorTrackAngular}
      - Jwt__ExpiryMinutes=${JWT_EXPIRY_MINUTES:-10080}
      - Auth__Username=${AUTH_USERNAME}
      - Auth__Password=${AUTH_PASSWORD}
    volumes:
      - tutortrack-data:/app/data
    restart: unless-stopped

volumes:
  tutortrack-data:
